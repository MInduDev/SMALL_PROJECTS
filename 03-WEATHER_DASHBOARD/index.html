<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body class="bg-default" id="pageBody">

<div class="container py-4 py-md-5" style="max-width: 900px;">

  <!-- Header -->
  <header class="d-flex justify-content-between align-items-center mb-4 dashboard-header">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-cloud-sun-fill header-icon"></i>
      <h1 class="brand-title">Weather Dashboard</h1>
    </div>
    <nav class="header-nav d-none d-sm-flex gap-4">
      <a href="#" class="nav-link-custom active">Today</a>
      <a href="#" class="nav-link-custom">Forecast</a>
    </nav>
  </header>

  <!-- Search -->
  <div class="glass-panel search-panel mb-4">
    <form id="searchForm" class="d-flex flex-column flex-sm-row gap-2">

      <div class="search-input-wrap flex-grow-1">
        <i class="bi bi-geo-alt"></i>
        <input type="text" id="cityInput" class="search-input" placeholder="Enter city name" autocomplete="off" aria-label="City name">
      </div>

      <button type="submit" class="search-btn">
        <i class="bi bi-search"></i>
        <span>Search</span>
      </button>
    </form>

    <div id="errorMsg" class="error-message d-none">
      <i class="bi bi-exclamation-circle"></i>
      <span id="errorText"></span>
    </div>
  </div>

  <!-- Loading state -->
  <div id="loadingState" class="glass-panel text-center py-5 mb-4 d-none">
    <div class="spinner-custom"></div>
    <div id="loadingText" class="text-soft">Fetching weather…</div>
  </div>

  <!-- Main content -->
  <div id="weatherContent">

    <!-- Current weather -->
    <div class="glass-panel current-weather-card mb-4">
      <div class="row align-items-center g-4">
        <div class="col-12 col-md-7">
          <h2 class="city-name"><span id="cityName">—</span><span id="countryName" class="fw-normal"></span></h2>
          <div class="city-meta" id="dateTime">—</div>
          <div class="d-flex align-items-baseline gap-3 mt-4">
            
            <span class="display-num" id="tempValue">--°</span>
            <div>
              <div class="condition-label" id="conditionLabel">—</div>
              <div class="feels-like">Feels like <span id="feelsLike">--°</span></div>
            </div>
          </div>
          <p class="weather-desc mt-3 mb-0" id="weatherDesc">—</p>
        </div>
        <div class="col-12 col-md-5 text-center">
          <i class="bi weather-icon-lg" id="mainIcon"></i>
        </div>
      </div>
    </div>

    <!-- Details grid -->
    <div class="row g-3 mb-4" id="detailsGrid">
      <div class="col-6 col-md-4">
        <div class="glass-panel detail-card">
          <div class="detail-icon"><i class="bi bi-droplet-half"></i></div>
          <div>
            <div class="detail-label">Humidity</div>
            <div class="detail-value"><span id="humidityVal">--</span>%</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="glass-panel detail-card">
          <div class="detail-icon"><i class="bi bi-wind"></i></div>
          <div>
            <div class="detail-label">Wind Speed</div>
            <div class="detail-value"><span id="windVal">--</span> km/h</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="glass-panel detail-card">
          <div class="detail-icon"><i class="bi bi-speedometer2"></i></div>
          <div>
            <div class="detail-label">Pressure</div>
            <div class="detail-value"><span id="pressureVal">--</span> hPa</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="glass-panel detail-card">
          <div class="detail-icon"><i class="bi bi-eye"></i></div>
          <div>
            <div class="detail-label">Visibility</div>
            <div class="detail-value"><span id="visibilityVal">--</span> km</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="glass-panel detail-card">
          <div class="detail-icon"><i class="bi bi-sunrise"></i></div>
          <div>
            <div class="detail-label">Sunrise</div>
            <div class="detail-value" id="sunriseVal">--:--</div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-4">
        <div class="glass-panel detail-card">
          <div class="detail-icon"><i class="bi bi-sunset"></i></div>
          <div>
            <div class="detail-label">Sunset</div>
            <div class="detail-value" id="sunsetVal">--:--</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Forecast -->
    <div class="glass-panel forecast-panel">
      <h2 class="section-heading">5-Day Forecast</h2>
      <div class="forecast-scroll d-flex gap-3" id="forecastRow"></div>
    </div>

    <div class="demo-note" id="demoNote"></div>

  </div>
</div>


<script src="script.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
