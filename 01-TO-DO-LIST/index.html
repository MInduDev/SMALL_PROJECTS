<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-4 py-md-5">

        <div class="todo-card mx-auto">

            <!-- Header -->
            <div class="header-section text-center">

                <div class="app-icon">
                    <i class="bi bi-check2-square"></i>
                </div>

                <h1>My To-Do List</h1>

                <p>
                    Organize your day, one task at a time.
                </p>

            </div>


            <!-- Add Task Section -->
            <div class="row g-2 add-task-section">

                <div class="col-12 col-md-9">

                    <input
                        type="text"
                        id="taskInput"
                        class="form-control task-input"
                        placeholder="What do you need to do?"
                    >

                </div>

                <div class="col-12 col-md-3">

                    <button id="addTaskBtn" class="btn add-btn w-100">
                        <i class="bi bi-plus-lg"></i>
                        Add Task
                    </button>

                </div>

            </div>


            <!-- Summary -->
            <div class="row g-3 summary-section">

                <div class="col-4">

                    <div class="summary-card">
                        <div class="summary-icon">
                            <i class="bi bi-list-check"></i>
                        </div>

                        <div>
                            <h3 id="totalTasks">0</h3>
                            <p>Total Tasks</p>
                        </div>
                    </div>

                </div>


                <div class="col-4">

                    <div class="summary-card">
                        <div class="summary-icon completed-icon">
                            <i class="bi bi-check-circle"></i>
                        </div>

                        <div>
                            <h3 id="completedTasks">0</h3>
                            <p>Completed</p>
                        </div>
                    </div>

                </div>


                <div class="col-4">

                    <div class="summary-card">
                        <div class="summary-icon remaining-icon">
                            <i class="bi bi-clock"></i>
                        </div>

                        <div>
                            <h3 id="remainingTasks">0</h3>
                            <p>Remaining</p>
                        </div>
                    </div>

                </div>

            </div>


            <!-- Task Heading + Filters -->
            <div class="task-header">

                <div>
                    <h5>My Tasks</h5>
                    <span id="taskMessage">Stay focused and get things done.</span>
                </div>


                <div class="filter-buttons">

                    <button class="filter-btn active" data-filter="all">
                        All
                    </button>

                    <button class="filter-btn" data-filter="active">
                        Active
                    </button>

                    <button class="filter-btn" data-filter="completed">
                        Completed
                    </button>

                </div>

            </div>


            <!-- Task List -->
            <div id="taskList" class="list-group">

            </div>


            <!-- Empty State -->
            <div id="emptyState" class="empty-state">

                <div class="empty-icon">
                    <i class="bi bi-clipboard-check"></i>
                </div>

                <h5>No tasks yet</h5>

                <p>Add a task to get started.</p>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
